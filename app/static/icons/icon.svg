<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3d00"/>
      <stop offset="50%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ffea00"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="100%" stop-color="#14171d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#0d0f14"/>

  <!-- Remote Body Outline -->
  <rect x="136" y="46" width="240" height="420" rx="46" fill="url(#bodyGrad)" stroke="#3a4050" stroke-width="4"/>

  <!-- Power Button -->
  <circle cx="180" cy="90" r="16" fill="#20242c" stroke="#ff3d00" stroke-width="2.5"/>
  <path d="M180 82 v8 M173 85 a9 9 0 1 0 14 0" fill="none" stroke="#ff3d00" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Brand Flame / LED Indicator -->
  <circle cx="332" cy="90" r="6" fill="url(#fireGrad)" filter="url(#glow)"/>

  <!-- D-Pad Outer Ring -->
  <circle cx="256" cy="210" r="76" fill="#1c202a" stroke="#333a4a" stroke-width="3"/>

  <!-- D-Pad Arrows -->
  <!-- Up -->
  <polygon points="256,148 246,160 266,160" fill="#8892a6"/>
  <!-- Down -->
  <polygon points="256,272 246,260 266,260" fill="#8892a6"/>
  <!-- Left -->
  <polygon points="194,210 206,200 206,220" fill="#8892a6"/>
  <!-- Right -->
  <polygon points="318,210 306,200 306,220" fill="#8892a6"/>

  <!-- D-Pad Center OK Button -->
  <circle cx="256" cy="210" r="38" fill="url(#fireGrad)"/>
  <circle cx="256" cy="210" r="34" fill="#181b22"/>
  <text x="256" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ff9100" text-anchor="middle">OK</text>

  <!-- Button Row 1 (Back, Home, Menu) -->
  <circle cx="186" cy="324" r="20" fill="#202530"/>
  <path d="M192 324 h-12 m5 -5 l-5 5 l5 5" fill="none" stroke="#a0aab8" stroke-width="2.5" stroke-linecap="round"/>

  <circle cx="256" cy="324" r="20" fill="#202530"/>
  <path d="M249 328 v-6 l7 -5 l7 5 v6 h-4 v-4 h-6 v4 z" fill="#a0aab8"/>

  <circle cx="326" cy="324" r="20" fill="#202530"/>
  <path d="M318 319 h16 M318 324 h16 M318 329 h16" fill="none" stroke="#a0aab8" stroke-width="2" stroke-linecap="round"/>

  <!-- Button Row 2 (Rewind, Play/Pause, Fast Forward) -->
  <circle cx="186" cy="382" r="18" fill="#202530"/>
  <path d="M188 376 l-5 6 l5 6 M183 376 l-5 6 l5 6" fill="none" stroke="#8892a6" stroke-width="2" stroke-linecap="round"/>

  <circle cx="256" cy="382" r="18" fill="#202530"/>
  <polygon points="252,376 262,382 252,388" fill="#ff9100"/>

  <circle cx="326" cy="382" r="18" fill="#202530"/>
  <path d="M324 376 l5 6 l-5 6 M329 376 l5 6 l-5 6" fill="none" stroke="#8892a6" stroke-width="2" stroke-linecap="round"/>
</svg>
